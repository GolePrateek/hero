<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SM Kit Drag and Drop - Slide 3</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="panel">
        <div class="panel-top">
          <h1>SM Kit Drag and Drop - Slide 3</h1>
          <p id="progress" class="progress" aria-live="polite"></p>
        </div>
        <p id="instruction" class="instruction" aria-live="polite"></p>
        <div class="controls">
          <a class="link-btn" href="index.html">Open Slide 2</a>
          <button id="resetBtn" type="button">Reset</button>
        </div>
      </section>

      <section class="stage-shell">
        <div id="stage" class="stage" aria-label="Slide 3 drag and drop learning board"></div>
      </section>
    </main>

    <script src="script-slide3.js"></script>
  </body>
</html>
